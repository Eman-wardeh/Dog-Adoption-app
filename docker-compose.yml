services:

  dog-api:
    build: .
    container_name: dog-api
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - mongodb


  mongodb:
    image: mongo:7
    container_name: dog-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db


volumes:
  mongo-data: